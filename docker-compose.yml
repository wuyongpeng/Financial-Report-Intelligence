services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REPORTS_DIR: /data/reports
      RUNTIME_DIR: /app/.data
      LLM_MODELS: ${LLM_MODELS:-thudm/glm-5.2,minimax/MiniMax-M2.7-highspeed,thudm/glm-5.1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/reports:/data/reports
      - ${DATA_DIR:-./data}/runtime:/app/.data

  worker:
    build: .
    command: npm run worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REPORTS_DIR: /data/reports
      RUNTIME_DIR: /app/.data
      LLM_MODELS: ${LLM_MODELS:-thudm/glm-5.2,minimax/MiniMax-M2.7-highspeed,thudm/glm-5.1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}/reports:/data/reports
      - ${DATA_DIR:-./data}/runtime:/app/.data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy-data:/data
      - ${DATA_DIR:-./data}/caddy-config:/config
    depends_on:
      - app
